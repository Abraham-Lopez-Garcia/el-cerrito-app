name: liga_futbol_app
description: "Aplicación para gestión de liga de fútbol 5"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:    # ← agrega esta línea
    sdk: flutter   
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.0.0
  firebase_database: ^11.3.10
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  flutter_colorpicker: ^1.0.3
  firebase_auth: ^5.7.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.0.14
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  image_gallery_saver_plus: ^4.0.1
  permission_handler: ^12.0.1
  http: ^1.6.0
  google_fonts: ^6.2.1        # ← solo esta línea nueva
  carousel_slider: ^5.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/LogoAppG.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/LogoAppG.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/